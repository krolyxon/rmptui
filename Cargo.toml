[package]
name = "rmptui"
authors = ["krolyxon"]
description = "A fast, keyboard-driven MPD client for the terminal"
readme = "README.md"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/krolyxon/rmptui"
keywords = ["mpd", "music", "cli", "tui", "client"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
libc = "0.2.186"
lofty = "0.25.4"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
realfft = "3.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
unicode-width = "0.2.2"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
